<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkEasy</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --inline-code-bg: #eef2f7;
      --accent: #1b74e4;
      --accent-strong: #0e5fc4;
      --ok: #14875f;
      --warn: #b7791f;
      --danger: #c2413b;
      --shadow: 0 14px 40px rgba(25, 38, 68, 0.12);
      --outline-width: 30%;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #16181d;
      --panel: #20242b;
      --panel-soft: #262b33;
      --text: #eef2f7;
      --muted: #a7b0bd;
      --line: #38414e;
      --inline-code-bg: #303743;
      --accent: #58a6ff;
      --accent-strong: #79b8ff;
      --ok: #46c08a;
      --warn: #d7a642;
      --danger: #ff736c;
      --shadow: 0 16px 42px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel);
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .primary:hover {
      background: var(--accent-strong);
      color: #ffffff;
    }

    .icon-only {
      width: 38px;
      padding: 0;
    }

    .toolbar-select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 34px 0 10px;
      color: var(--text);
      background: var(--panel);
      outline: 0;
      cursor: pointer;
    }

    .toolbar-select:focus {
      border-color: var(--accent);
    }

    .app {
      height: 100%;
      min-width: 320px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .toolbar {
      min-height: 58px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #1b74e4;
      color: #ffffff;
      flex: 0 0 auto;
      box-shadow: 0 6px 18px rgba(27, 116, 228, 0.28);
    }

    .file-meta {
      min-width: 0;
    }

    .file-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 34vw;
    }

    .file-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 34vw;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 8px;
    }

    .segmented button {
      border: 0;
      min-height: 30px;
      padding: 0 10px;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: var(--panel);
      color: var(--accent-strong);
      box-shadow: 0 1px 3px rgba(20, 30, 48, 0.12);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(220px, var(--outline-width)) 8px minmax(420px, 1fr);
      min-height: 0;
      position: relative;
    }

    .outline-collapsed .workspace {
      grid-template-columns: minmax(0, 1fr);
    }

    .outline-collapsed .outline-pane,
    .outline-collapsed .outline-resizer {
      display: none;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--panel);
    }

    .outline-pane {
      border-right: 1px solid var(--line);
    }

    .outline-resizer {
      position: relative;
      z-index: 2;
      cursor: col-resize;
      background: var(--bg);
      border-right: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .outline-resizer::before {
      content: "";
      position: absolute;
      inset: 0 2px;
      border-radius: 6px;
      background: transparent;
    }

    .outline-resizer:hover::before,
    .outline-resizing .outline-resizer::before {
      background: var(--accent);
      opacity: 0.38;
    }

    .document-pane {
      min-width: 0;
    }

    .pane-head {
      min-height: 46px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-soft);
    }

    .pane-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .pane-tools {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .document-body,
    .editor-wrap {
      min-height: 0;
      position: relative;
    }

    .source-panel,
    .preview-panel {
      min-height: 0;
      height: 100%;
    }

    .source-mode .preview-panel,
    .preview-mode .source-panel {
      display: none;
    }

    #markdownInput {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 18px;
      color: var(--text);
      background: var(--panel);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.65;
      tab-size: 2;
    }

    #markdownInput::placeholder {
      color: var(--muted);
    }

    .preview-scroll {
      overflow: auto;
      min-height: 0;
      background: var(--bg);
      padding: 26px;
    }

    .preview-shell {
      width: min(100%, 980px);
      margin: 0 auto;
      background: var(--panel);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .outline-list {
      overflow: auto;
      padding: 10px;
      background: var(--panel);
    }

    .outline-empty {
      display: grid;
      place-items: center;
      min-height: 180px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 18px;
    }

    .outline-item {
      width: 100%;
      min-height: 34px;
      justify-content: flex-start;
      border: 0;
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
      padding: 7px 9px;
      margin: 1px 0;
    }

    .outline-item:hover {
      background: var(--panel-soft);
    }

    .outline-level-1 {
      font-weight: 700;
    }

    .outline-level-2 {
      padding-left: 24px;
      color: var(--text);
    }

    .outline-level-3 {
      padding-left: 42px;
      color: var(--muted);
    }

    .outline-level-4 {
      padding-left: 58px;
      color: var(--muted);
    }

    .outline-number {
      flex: 0 0 auto;
      color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
    }

    .outline-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 14px;
      color: var(--accent);
    }

    .statusbar {
      min-height: 34px;
      padding: 6px 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
    }

    .status-list {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .status-message {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .drop-overlay {
      display: none;
      position: absolute;
      inset: 12px;
      z-index: 8;
      border: 2px dashed var(--accent);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      place-items: center;
      color: var(--accent-strong);
      font-weight: 700;
      pointer-events: none;
    }

    .app.dragging .drop-overlay {
      display: grid;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 46px;
      max-width: min(440px, calc(100vw - 36px));
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .context-menu {
      position: fixed;
      z-index: 20;
      width: 240px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu button {
      width: 100%;
      min-height: 34px;
      justify-content: flex-start;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
    }

    .context-menu button:hover {
      background: var(--panel-soft);
    }

    .table-toolbar {
      position: fixed;
      z-index: 22;
      max-width: min(520px, calc(100vw - 20px));
      display: none;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .table-toolbar.show {
      display: flex;
      flex-wrap: wrap;
    }

    .table-toolbar button {
      min-height: 32px;
      padding: 0 9px;
      border-radius: 7px;
      gap: 6px;
      background: transparent;
      border: 0;
    }

    .table-toolbar button:hover {
      background: var(--panel-soft);
    }

    .table-toolbar button[hidden] {
      display: none;
    }

    .table-edge-add {
      position: fixed;
      z-index: 21;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--panel);
      color: var(--accent);
      box-shadow: var(--shadow);
      display: none;
    }

    .table-edge-add.show {
      display: inline-flex;
    }

    .table-resize-handle {
      position: fixed;
      z-index: 19;
      display: none;
      background: rgba(27, 116, 228, 0.28);
    }

    .table-resize-handle.show {
      display: block;
    }

    .table-col-resize {
      width: 6px;
      cursor: col-resize;
    }

    .table-row-resize {
      height: 6px;
      cursor: row-resize;
    }

    body.table-resizing {
      user-select: none;
    }

    body.table-resizing * {
      cursor: inherit !important;
    }

    .context-separator {
      height: 1px;
      margin: 5px 4px;
      background: var(--line);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.42);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
    }

    .modal-actions {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .modal-title {
      font-weight: 700;
    }

    .modal-body {
      padding: 14px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #formulaInput {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel);
      font-family: var(--mono);
      line-height: 1.6;
    }

    #formulaInput:focus {
      border-color: var(--accent);
    }

    .modal textarea,
    .modal input[type="text"],
    .modal input[type="url"],
    .modal input[type="number"],
    .modal select {
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      color: var(--text);
      background: var(--panel);
    }

    .modal textarea:focus,
    .modal input:focus,
    .modal select:focus {
      border-color: var(--accent);
    }

    .text-grid {
      display: grid;
      gap: 12px;
    }

    .text-field {
      display: grid;
      gap: 8px;
    }

    .text-field input,
    .text-field select {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
    }

    .text-field textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      padding: 10px 12px;
      font-family: var(--mono);
      line-height: 1.6;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .number-field {
      display: grid;
      gap: 8px;
    }

    .number-field input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      padding: 0 10px;
      color: var(--text);
      background: var(--panel);
    }

    .number-field input:focus {
      border-color: var(--accent);
    }

    .field-hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .checkbox-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text);
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100%;
        height: auto;
      }

      .toolbar {
        align-items: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .outline-collapsed .workspace {
        grid-template-columns: 1fr;
      }

      .outline-pane {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        min-height: 220px;
        max-height: 34vh;
      }

      .outline-resizer {
        display: none;
      }

      .document-pane {
        min-height: 58vh;
      }

      .file-name,
      .file-detail {
        max-width: 46vw;
      }
    }

    @media (max-width: 680px) {
      .toolbar {
        padding: 10px;
        flex-direction: column;
      }

      .brand,
      .toolbar-actions {
        width: 100%;
      }

      .toolbar-actions {
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .file-name,
      .file-detail {
        max-width: calc(100vw - 86px);
      }

      .preview-scroll {
        padding: 12px;
      }

      .statusbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
  <style id="content-style">
    .markdown-body {
      padding: 42px 52px;
      background: var(--panel, #ffffff);
      color: var(--text, #172033);
      font-family: var(--sans, ui-sans-serif, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.72;
      overflow-wrap: break-word;
    }

    .markdown-body[contenteditable="true"] {
      outline: 0;
      caret-color: var(--accent, #1b74e4);
    }

    .markdown-body[contenteditable="true"]:focus {
      box-shadow: inset 0 0 0 2px rgba(27, 116, 228, 0.18);
    }

    .markdown-body[data-empty="true"]::before {
      content: "在此输入 Markdown 内容";
      display: block;
      color: var(--muted, #667085);
      pointer-events: none;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      line-height: 1.28;
      margin: 1.7em 0 0.65em;
      color: var(--text, #172033);
      font-weight: 780;
    }

    .markdown-body h1 {
      font-size: 2.15em;
      padding-bottom: 0.28em;
      border-bottom: 1px solid var(--line, #d9e0ea);
      text-align: center;
    }

    .markdown-body h2 {
      font-size: 1.55em;
      padding-bottom: 0.22em;
      border-bottom: 1px solid var(--line, #d9e0ea);
    }

    .markdown-body h3 {
      font-size: 1.25em;
    }

    .markdown-body h4 {
      font-size: 1.08em;
    }

    .markdown-body h2[data-outline-number]::before,
    .markdown-body h3[data-outline-number]::before,
    .markdown-body h4[data-outline-number]::before {
      content: attr(data-outline-number) " ";
      color: var(--accent-strong, #0e5fc4);
      font-variant-numeric: tabular-nums;
      user-select: none;
      pointer-events: none;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body .mermaid {
      margin: 0 0 1.05em;
    }

    .markdown-body a {
      color: var(--accent, #1b74e4);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body mark {
      padding: 0.08em 0.28em;
      border-radius: 5px;
      background: #fff3a3;
      color: #1f2937;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.45em;
    }

    .markdown-body li + li {
      margin-top: 0.28em;
    }

    .markdown-body blockquote {
      padding: 0.1em 1em;
      color: var(--muted, #667085);
      border-left: 4px solid var(--accent, #1b74e4);
      background: var(--panel-soft, #f9fbff);
    }

    .markdown-body hr {
      height: 1px;
      border: 0;
      background: var(--line, #d9e0ea);
      margin: 2em 0;
    }

    .markdown-body img,
    .markdown-body svg {
      max-width: 100%;
      height: auto;
    }

    .markdown-body img {
      display: block;
      margin: 1em auto;
      border-radius: 8px;
    }

    .markdown-body .image-block {
      margin: 1em 0;
      position: relative;
    }

    .markdown-body .image-block img {
      display: inline-block;
      margin: 0;
      max-width: 100%;
      height: auto;
    }

    .markdown-body .image-align-left {
      text-align: left;
    }

    .markdown-body .image-align-center {
      text-align: center;
    }

    .markdown-body .image-align-right {
      text-align: right;
    }

    .node-edit-button {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 5;
      min-height: 30px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line, #d9e0ea);
      background: var(--panel, #ffffff);
      color: var(--text, #172033);
      box-shadow: 0 8px 20px rgba(25, 38, 68, 0.16);
      opacity: 0;
      pointer-events: none;
    }

    .markdown-body .image-block:hover .node-edit-button,
    .markdown-body .mermaid:hover .node-edit-button,
    .markdown-body .math-node:hover .node-edit-button,
    .node-edit-button:focus {
      opacity: 1;
      pointer-events: auto;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line, #d9e0ea);
      padding: 0.55em 0.72em;
      vertical-align: top;
    }

    .markdown-body th {
      background: var(--panel-soft, #f9fbff);
      font-weight: 700;
    }

    .markdown-body td.table-cell-selected,
    .markdown-body th.table-cell-selected {
      background: rgba(27, 116, 228, 0.14);
      box-shadow: inset 0 0 0 2px var(--accent, #1b74e4);
    }

    .markdown-body td.table-cell-active,
    .markdown-body th.table-cell-active {
      box-shadow: inset 0 0 0 2px var(--accent, #1b74e4);
    }

    .markdown-body code {
      font-family: var(--mono, Consolas, monospace);
      font-size: 0.92em;
      padding: 0.15em 0.35em;
      border-radius: 6px;
      background: var(--inline-code-bg, #eef2f7);
    }

    .markdown-body pre {
      position: relative;
      overflow: auto;
      padding: 1em;
      border: 1px solid var(--line, #d9e0ea);
      border-radius: 8px;
      background: #0f172a;
      color: #d6e4ff;
      line-height: 1.62;
    }

    .markdown-body pre code {
      display: block;
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: 0.9em;
    }

    .code-copy {
      position: absolute;
      right: 10px;
      top: 10px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 23, 42, 0.76);
      color: #dbeafe;
      font-size: 12px;
      opacity: 0;
    }

    .markdown-body pre:hover .code-copy,
    .code-copy:focus {
      opacity: 1;
    }

    .markdown-body .mermaid {
      overflow-x: auto;
      padding: 1em;
      border: 1px solid var(--line, #d9e0ea);
      border-radius: 8px;
      background: var(--panel-soft, #f9fbff);
      text-align: center;
      position: relative;
    }

    .markdown-body .math-node,
    .markdown-body .mermaid[contenteditable="false"] {
      cursor: default;
    }

    .markdown-body .math-node {
      position: relative;
    }

    .markdown-body .math-inline {
      display: inline-block;
    }

    .markdown-body .math-node mjx-assistive-mml {
      display: none !important;
    }

    .markdown-body .math-node mjx-container {
      max-width: 100%;
    }

    .markdown-body .math-block {
      display: block;
      overflow-x: auto;
      margin: 1em 0;
      text-align: center;
    }

    .markdown-body .render-error {
      text-align: left;
      color: var(--danger, #c2413b);
      white-space: pre-wrap;
      font-family: var(--mono, Consolas, monospace);
      font-size: 13px;
    }

    .markdown-body mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    .markdown-body .task-list-item {
      list-style: none;
    }

    .markdown-body .task-list-item input {
      margin: 0 0.45em 0 -1.25em;
      vertical-align: middle;
    }

    .hljs-comment,
    .hljs-quote {
      color: #8b949e;
      font-style: italic;
    }

    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-subst {
      color: #ff7b72;
    }

    .hljs-number,
    .hljs-literal,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-tag .hljs-attr {
      color: #79c0ff;
    }

    .hljs-string,
    .hljs-doctag {
      color: #a5d6ff;
    }

    .hljs-title,
    .hljs-section,
    .hljs-selector-id {
      color: #d2a8ff;
      font-weight: 700;
    }

    .hljs-type,
    .hljs-class .hljs-title {
      color: #ffa657;
    }

    .hljs-tag,
    .hljs-name,
    .hljs-attribute {
      color: #7ee787;
    }

    .hljs-regexp,
    .hljs-link {
      color: #a5d6ff;
    }

    .hljs-symbol,
    .hljs-bullet {
      color: #f2cc60;
    }

    .hljs-built_in,
    .hljs-builtin-name {
      color: #ffa657;
    }

    .hljs-meta {
      color: #8b949e;
    }

    .hljs-deletion {
      background: rgba(248, 81, 73, 0.18);
    }

    .hljs-addition {
      background: rgba(46, 160, 67, 0.18);
    }

    @media (max-width: 680px) {
      .markdown-body {
        padding: 26px 22px;
        font-size: 15px;
      }

      .markdown-body h1 {
        font-size: 1.7em;
      }

      .markdown-body h2 {
        font-size: 1.35em;
      }
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        background: #ffffff;
      }

      html,
      body {
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }

      .toolbar,
      .outline-pane,
      .source-panel,
      .pane-head,
      .context-menu,
      .modal-backdrop,
      .statusbar,
      .code-copy,
      .node-edit-button {
        display: none !important;
      }

      .app,
      .workspace,
      .document-pane,
      .document-body,
      .preview-panel,
      .preview-scroll,
      .preview-shell {
        display: block;
        height: auto;
        min-height: 0;
        padding: 0;
        margin: 0;
        overflow: visible;
        border: 0;
        box-shadow: none;
        background: #ffffff;
      }

      .markdown-body {
        color: #111827;
        background: #ffffff;
        padding: 0;
        font-size: 15px;
        line-height: 1.68;
        overflow: visible;
      }

      .markdown-body pre,
      .markdown-body table,
      .markdown-body .mermaid,
      .markdown-body .math-block,
      .markdown-body .image-block {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .markdown-body pre,
      .markdown-body .mermaid {
        overflow: visible;
      }

      .markdown-body pre code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .markdown-body .mermaid svg,
      .markdown-body .math-node svg,
      .markdown-body img {
        max-width: 100%;
        height: auto;
      }

      @page {
        size: A4;
        margin: 12mm;
      }
    }
  </style>
</head>
<body>
  <div class="app preview-mode" id="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="file-text"></i></div>
        <div class="file-meta">
        <div class="file-name" id="fileName">MarkEasy</div>
          <div class="file-detail" id="fileDetail">未加载文件</div>
        </div>
      </div>

      <div class="toolbar-actions">
        <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
        <button type="button" class="primary" id="openFile" title="打开 Markdown 文件">
          <i data-lucide="folder-open"></i><span>打开</span>
        </button>
        <button type="button" id="exportHtml" title="导出 HTML 文件">
          <i data-lucide="file-code-2"></i><span>HTML</span>
        </button>
        <button type="button" id="exportPdf" title="导出 A4 PDF 文件">
          <i data-lucide="file-down"></i><span>PDF</span>
        </button>
        <button type="button" id="exportMd" title="导出 Markdown 文件">
          <i data-lucide="file-text"></i><span>MD</span>
        </button>
        <button type="button" id="outlineToggle" title="显示或隐藏大纲">
          <i data-lucide="list-tree"></i><span>大纲</span>
        </button>
        <select id="numberingMode" class="toolbar-select" title="标题编号方式" aria-label="标题编号方式">
          <option value="mode1">按章节</option>
          <option value="mode2">按大写</option>
          <option value="mode3">自动序号</option>
          <option value="none">不编号</option>
        </select>
        <div class="segmented" role="group" aria-label="编辑模式">
          <button type="button" data-view="preview" class="active" title="预览编辑"><i data-lucide="eye"></i><span>预览</span></button>
          <button type="button" data-view="source" title="源码编辑"><i data-lucide="braces"></i><span>源码</span></button>
        </div>
        <button type="button" class="icon-only" id="themeToggle" title="切换主题">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="pane outline-pane" aria-label="文档大纲">
        <div class="pane-head">
          <div class="pane-title"><i data-lucide="list-tree"></i><span>大纲</span></div>
          <div class="pane-tools" id="outlineStats">0 项</div>
        </div>
        <div class="outline-list" id="outlineList">
          <div class="outline-empty">暂无一级至四级标题</div>
        </div>
      </aside>
      <div class="outline-resizer" id="outlineResizer" role="separator" aria-label="调整大纲宽度" aria-orientation="vertical"></div>

      <section class="pane document-pane" aria-label="Markdown 文档">
        <div class="pane-head">
          <div class="pane-title" id="documentTitle"><i data-lucide="eye"></i><span>预览编辑</span></div>
          <div class="pane-tools" id="renderStats">0 标题 · 0 代码块 · 0 图表</div>
        </div>
        <div class="document-body">
          <div class="editor-wrap source-panel" id="sourcePanel">
            <textarea id="markdownInput" spellcheck="false" placeholder="在此粘贴 Markdown，或打开 .md 文件"></textarea>
          </div>
          <div class="preview-scroll preview-panel" id="previewScroll">
            <div class="preview-shell">
              <article class="markdown-body" id="preview" contenteditable="true" spellcheck="false">
                <div class="empty-state">
                  <div>
                    <i data-lucide="file-search"></i>
                    <div>未加载 Markdown</div>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </section>
      <div class="drop-overlay">释放文件</div>
    </main>

    <footer class="statusbar">
      <div class="status-list">
        <span id="statusText">就绪</span>
        <span id="sizeText">0 KB</span>
        <span id="updatedText">本地页面</span>
      </div>
      <div class="status-message" id="messageText"></div>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="context-menu" id="contextMenu" role="menu" aria-label="预览编辑菜单">
    <button type="button" data-command="h1"><i data-lucide="heading-1"></i><span>设为一级标题</span></button>
    <button type="button" data-command="h2"><i data-lucide="heading-2"></i><span>设为二级标题</span></button>
    <button type="button" data-command="h3"><i data-lucide="heading-3"></i><span>设为三级标题</span></button>
    <button type="button" data-command="h4"><i data-lucide="heading-4"></i><span>设为四级标题</span></button>
    <button type="button" data-command="paragraph"><i data-lucide="pilcrow"></i><span>设为正文</span></button>
    <div class="context-separator"></div>
    <button type="button" data-command="bold"><i data-lucide="bold"></i><span>加粗</span></button>
    <button type="button" data-command="italic"><i data-lucide="italic"></i><span>斜体</span></button>
    <button type="button" data-command="underline"><i data-lucide="underline"></i><span>下划线</span></button>
    <button type="button" data-command="highlight"><i data-lucide="highlighter"></i><span>高亮</span></button>
    <div class="context-separator"></div>
    <button type="button" data-command="link"><i data-lucide="link"></i><span>插入链接</span></button>
    <button type="button" data-command="image"><i data-lucide="image"></i><span>插入图像</span></button>
    <button type="button" data-command="formula"><i data-lucide="sigma"></i><span>插入公式</span></button>
    <button type="button" data-command="table"><i data-lucide="table-2"></i><span>插入表格</span></button>
    <button type="button" data-command="flowchart"><i data-lucide="workflow"></i><span>插入流程图</span></button>
    <button type="button" data-command="code"><i data-lucide="code-2"></i><span>插入代码块</span></button>
    <div class="context-separator"></div>
    <button type="button" data-command="paragraph-before"><i data-lucide="corner-left-up"></i><span>上方插入段落</span></button>
    <button type="button" data-command="paragraph-after"><i data-lucide="corner-left-down"></i><span>下方插入段落</span></button>
  </div>

  <div class="table-toolbar" id="tableToolbar" role="toolbar" aria-label="表格编辑工具">
    <button type="button" data-table-tool="select-row" title="选中当前行"><i data-lucide="rows-3"></i><span>行</span></button>
    <button type="button" data-table-tool="select-column" title="选中当前列"><i data-lucide="columns-3"></i><span>列</span></button>
    <button type="button" data-table-tool="merge" title="合并选中单元格"><i data-lucide="combine"></i><span>合并</span></button>
    <button type="button" data-table-tool="split" title="拆分当前单元格"><i data-lucide="split-square-horizontal"></i><span>拆分</span></button>
    <button type="button" data-table-tool="delete-row" title="删除选中行"><i data-lucide="trash-2"></i><span>删行</span></button>
    <button type="button" data-table-tool="delete-column" title="删除选中列"><i data-lucide="trash-2"></i><span>删列</span></button>
    <button type="button" data-table-tool="equal-columns" title="等分列宽"><i data-lucide="columns-3"></i><span>等列</span></button>
    <button type="button" data-table-tool="equal-rows" title="等分行高"><i data-lucide="rows-3"></i><span>等行</span></button>
  </div>
  <button type="button" class="table-edge-add" id="tableAddRow" title="下方添加行"><i data-lucide="plus"></i></button>
  <button type="button" class="table-edge-add" id="tableAddColumn" title="右侧添加列"><i data-lucide="plus"></i></button>
  <div class="table-resize-handle table-col-resize" id="tableColumnResize" aria-hidden="true"></div>
  <div class="table-resize-handle table-row-resize" id="tableRowResize" aria-hidden="true"></div>

  <div class="modal-backdrop" id="formulaDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formulaTitle">
      <div class="modal-head">
        <div class="modal-title" id="formulaTitle">插入公式</div>
        <button type="button" class="icon-only" id="formulaClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <label class="text-field" for="formulaTemplate">
          <span class="field-label">常用公式示例</span>
          <select id="formulaTemplate">
            <option value="">自定义</option>
            <option value="pythagorean">勾股定理</option>
            <option value="quadratic">一元二次方程</option>
            <option value="integral">定积分</option>
            <option value="matrix">矩阵</option>
            <option value="limit">极限</option>
            <option value="sum">求和</option>
            <option value="bayes">贝叶斯公式</option>
          </select>
        </label>
        <label class="field-label" for="formulaInput">输入 Markdown / LaTeX 公式，例如 $a^2+b^2=c^2$ 或 $$\int_0^1 x^2 dx$$</label>
        <textarea id="formulaInput" spellcheck="false" placeholder="$E = mc^2$"></textarea>
        <label class="checkbox-row">
          <input type="checkbox" id="formulaBlock">
          <span>块级公式</span>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" id="formulaCancel">取消</button>
        <button type="button" class="primary" id="formulaConfirm">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="tableDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tableTitle">
      <div class="modal-head">
        <div class="modal-title" id="tableTitle">插入表格</div>
        <button type="button" class="icon-only" id="tableClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="number-grid">
          <label class="number-field" for="tableRows">
            <span class="field-label">行数（含表头）</span>
            <input type="number" id="tableRows" min="1" max="50" value="3" inputmode="numeric">
          </label>
          <label class="number-field" for="tableCols">
            <span class="field-label">列数</span>
            <input type="number" id="tableCols" min="1" max="20" value="3" inputmode="numeric">
          </label>
        </div>
        <div class="field-hint">生成后可直接在预览区单元格中编辑内容。</div>
      </div>
      <div class="modal-actions">
        <button type="button" id="tableCancel">取消</button>
        <button type="button" class="primary" id="tableConfirm">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="imageDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="imageTitle">
      <div class="modal-head">
        <div class="modal-title" id="imageTitle">插入图像</div>
        <button type="button" class="icon-only" id="imageClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="text-grid">
          <label class="text-field" for="imageUrl">
            <span class="field-label">图片地址</span>
            <input type="url" id="imageUrl" placeholder="https://example.com/image.png">
          </label>
          <div class="text-field">
            <span class="field-label">本地图片</span>
            <input type="file" id="imageFile" accept="image/*" hidden>
            <button type="button" id="imageFileButton"><i data-lucide="image-plus"></i><span>选择本地图片</span></button>
          </div>
          <label class="text-field" for="imageAlt">
            <span class="field-label">图片说明</span>
            <input type="text" id="imageAlt" placeholder="图片">
          </label>
          <div class="number-grid">
            <label class="number-field" for="imageWidth">
              <span class="field-label">显示宽度（%）</span>
              <input type="number" id="imageWidth" min="5" max="100" value="70" inputmode="numeric">
            </label>
            <label class="number-field" for="imageAlign">
              <span class="field-label">对齐方式</span>
              <select id="imageAlign">
                <option value="center">居中</option>
                <option value="left">左对齐</option>
                <option value="right">右对齐</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="imageCancel">取消</button>
        <button type="button" class="primary" id="imageConfirm">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="flowchartDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="flowchartTitle">
      <div class="modal-head">
        <div class="modal-title" id="flowchartTitle">插入流程图</div>
        <button type="button" class="icon-only" id="flowchartClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <label class="text-field" for="flowchartTemplate">
          <span class="field-label">流程图类型示例</span>
          <select id="flowchartTemplate">
            <option value="">自定义</option>
            <option value="flowchart">基础流程图</option>
            <option value="sequence">时序图</option>
            <option value="state">状态图</option>
            <option value="class">类图</option>
            <option value="gantt">甘特图</option>
            <option value="pie">饼图</option>
            <option value="er">ER 图</option>
          </select>
        </label>
        <label class="text-field" for="flowchartInput">
          <span class="field-label">Mermaid 源码</span>
          <textarea id="flowchartInput" spellcheck="false">flowchart TD

  B -- 是 --> C[完成]
  B -- 否 --> D[调整]
  D --> B</textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" id="flowchartCancel">取消</button>
        <button type="button" class="primary" id="flowchartConfirm">确认</button>
      </div>
    </div>
  </div>

  <script>
    window.MathJax = {

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');

      function htmlToMarkdown(root) {
        const clone = root.cloneNode(true);
        const preserved = [];
        const preserveNode = (node, markdown) => {
          const placeholder = `MDVIEWERPRESERVE${preserved.length}END`;
          preserved.push({ placeholder, markdown });
          node.replaceWith(document.createTextNode(placeholder));
        };
        clone.querySelectorAll('.code-copy, .node-edit-button, .empty-state').forEach((node) => node.remove());
        clone.querySelectorAll('[contenteditable]').forEach((node) => node.removeAttribute('contenteditable'));
        clone.querySelectorAll('.math-node').forEach((node) => {
          if (!node.dataset.md && node.dataset.tex) {
            node.dataset.md = node.classList.contains('math-block') ? `$$\n${node.dataset.tex}\n$$` : `$${node.dataset.tex}$`;
          }
          preserveNode(node, node.classList.contains('math-block') ? `\n\n${node.dataset.md}\n\n` : node.dataset.md);
        });
        clone.querySelectorAll('.mermaid[data-md]').forEach((node) => {
          preserveNode(node, `\n\n${node.dataset.md}\n\n`);
        });
        clone.querySelectorAll('.image-block').forEach((node) => {
          preserveNode(node, `\n\n${cleanHtmlBlock(node)}\n\n`);
        });
        clone.querySelectorAll('table').forEach((node) => {
          preserveNode(node, `\n\n${cleanHtmlBlock(node)}\n\n`);
        });
        let markdown = turndownService.turndown(clone);
        preserved.forEach((item) => {
          markdown = markdown.split(item.placeholder).join(item.markdown);
        });
        markdown = markdown.replace(/\n{3,}/g, '\n\n').trim();
        return markdown ? `${markdown}\n` : '';
      }

      function cleanHtmlBlock(node) {
        const clone = node.cloneNode(true);
        clone.querySelectorAll('[contenteditable], [data-outline-id], [data-outline-number]').forEach((item) => {
          item.removeAttribute('contenteditable');
          item.removeAttribute('data-outline-id');
          item.removeAttribute('data-outline-number');
        });
        clone.querySelectorAll('.code-copy, .node-edit-button').forEach((item) => item.remove());
        cleanTableEditingState(clone);
        return clone.outerHTML;

      async function handleLayoutExportRequest() {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('layoutExport')) return;
        document.documentElement.dataset.layoutExport = 'loading';
        window.__MARKDOWN_LAYOUT_EXPORT_READY__ = false;

        try {
          const payload = await readLayoutExportPayload(params);
          if (payload && typeof payload.content === 'string') {
            currentFileName = payload.name || sampleName;
            input.value = payload.content;
            fileName.textContent = currentFileName;
            fileDetail.textContent = 'PDF 布局导出';
            sizeText.textContent = formatBytes(new Blob([payload.content]).size);
            updatedText.textContent = '已加载';
          }

          await renderMarkdown();
          await waitForPreviewAssets();
          await waitForLayoutStability();
          document.documentElement.dataset.layoutExport = 'ready';
          window.__MARKDOWN_LAYOUT_EXPORT_READY__ = true;
          setMessage('PDF 布局导出就绪');
        } catch (error) {
          document.documentElement.dataset.layoutExport = 'error';
          window.__MARKDOWN_LAYOUT_EXPORT_ERROR__ = error.message || String(error);
          setMessage(`PDF 布局导出准备失败：${window.__MARKDOWN_LAYOUT_EXPORT_ERROR__}`, true);
        }
      }

      async function readLayoutExportPayload(params) {
        const sourceScript = params.get('sourceScript');
        if (sourceScript) {
          await loadLayoutExportScript(sourceScript);
          return window.__MARKDOWN_EXPORT_SOURCE__ || null;
        }

        const sourceUrl = params.get('md');
        if (sourceUrl) {
          const response = await fetch(sourceUrl, { cache: 'no-store' });
          const content = await response.text();
          return {
            name: decodeURIComponent(sourceUrl.split(/[\\/]/).pop() || sampleName),
            content
          };
        }

        const encoded = params.get('md64');
        if (encoded) {
          return {
            name: params.get('name') || sampleName,
            content: decodeBase64Utf8(encoded)
          };
        }

        return null;
      }

      function loadLayoutExportScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`无法加载导出数据脚本：${src}`));
          document.head.appendChild(script);
        });
      }

      function decodeBase64Utf8(value) {
        const binary = atob(value);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function waitForLayoutStability() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.setTimeout(resolve, 250);
            });
          });
        });
      }

      function hydrateLayout() {

        const collapsed = localStorage.getItem('markdown-viewer-outline-collapsed') === 'true';

      function toggleOutline() {

      function startOutlineResize(event) {
        if (app.classList.contains('outline-collapsed')) return;
        event.preventDefault();
        outlineResizer.setPointerCapture(event.pointerId);
        app.classList.add('outline-resizing');
        const onMove = (moveEvent) => {
          const rect = document.getElementById('workspace').getBoundingClientRect();
          const min = 220;
          const max = Math.max(min, rect.width * 0.58);
          const width = Math.min(max, Math.max(min, moveEvent.clientX - rect.left));
          document.documentElement.style.setProperty('--outline-width', `${width}px`);
        };
        const onUp = () => {
          app.classList.remove('outline-resizing');
          localStorage.setItem('markdown-viewer-outline-width', getComputedStyle(document.documentElement).getPropertyValue('--outline-width').trim());
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp, { once: true });
      }

      function runContextCommand(command) {
        closeContextMenu();
        if (command.startsWith('table-')) {
          runTableCommand(command);
          return;
        }
        if (command === 'formula') {
          openFormulaDialog();
          return;
        }
        if (command === 'table') {
          openTableDialog();
          return;
        }
        if (command === 'flowchart') {
          openFlowchartDialog();
          return;
        }
        if (command === 'image') {
          openImageDialog();
          return;
        }
        restoreSelection();

        if (command === 'h1' || command === 'h2' || command === 'h3' || command === 'h4') {
          document.execCommand('formatBlock', false, command);
          syncPreviewToSource(true);
          return;
        }
        if (command === 'paragraph') {
          document.execCommand('formatBlock', false, 'p');
          syncPreviewToSource(true);
          return;
        }
        if (command === 'bold') {
          document.execCommand('bold', false);
          syncPreviewToSource(true);
          return;
        }
        if (command === 'italic') {
          document.execCommand('italic', false);
          syncPreviewToSource(true);
          return;
        }
        if (command === 'underline') {
          document.execCommand('underline', false);
          syncPreviewToSource(true);
          return;
        }
        if (command === 'highlight') {
          wrapSelection('mark', '高亮文本');
          syncPreviewToSource(true);
          return;
        }
        if (command === 'link') {
          insertLink();
          syncPreviewToSource(true);
          return;
        }
        if (command === 'code') {
          insertCodeBlock();
          syncPreviewToSource(true);
          return;
        }
        if (command === 'paragraph-before' || command === 'paragraph-after') {
          insertAdjacentParagraph(command === 'paragraph-before');
          syncPreviewToSource(false);
        }
      }

      function openFormulaDialog() {
        restoreSelection();
        editingFormulaNode = findContextFormula();
        document.getElementById('formulaTitle').textContent = editingFormulaNode ? '编辑公式' : '插入公式';
        formulaTemplate.value = '';
        if (editingFormulaNode) {
          formulaInput.value = editingFormulaNode.dataset.md || '';
          formulaBlock.checked = editingFormulaNode.classList.contains('math-block');
        } else {
          const selected = getSelectedText();
          formulaInput.value = selected && selected.length < 300 ? selected : '';
          formulaBlock.checked = /^\s*(\$\$|\\\[)/.test(formulaInput.value);
        }
        formulaDialog.classList.add('show');
        formulaDialog.setAttribute('aria-hidden', 'false');
        setTimeout(() => formulaInput.focus(), 0);

      function closeFormulaDialog() {
        formulaDialog.classList.remove('show');
